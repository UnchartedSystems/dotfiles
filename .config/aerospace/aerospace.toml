# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-ctrl-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 0
inner.vertical =   0
outer.left =       0
outer.bottom =     0
outer.top =        0
outer.right =      0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}

[mode.main.binding]

### Custom Keybinds

ctrl-alt-b = 'exec-and-forget sh -c "osascript -e \"tell application \\\"Safari\\\" to make new document\" && osascript -e \"tell application \\\"Safari\\\" to activate\""'

ctrl-alt-t = 'exec-and-forget open -n /Applications/Ghostty.app'

ctrl-alt-g = 'exec-and-forget /opt/local/bin/fish -c "ec"'

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget

### TODO: setup config for multi monitor support!
# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-monitor
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
# See: https://nikitabobko.github.io/AeroSpace/commands#focus-monitor
# See: https://nikitabobko.github.io/AeroSpace/commands#summon-workspace


# See: https://nikitabobko.github.io/AeroSpace/commands#close
ctrl-alt-esc = 'close --quit-if-last-window'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#fullscreen
ctrl-alt-m = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
ctrl-alt-h = 'focus left --boundaries-action wrap-around-the-workspace'
ctrl-alt-j = 'focus down --boundaries-action wrap-around-the-workspace'
ctrl-alt-k = 'focus up --boundaries-action wrap-around-the-workspace'
ctrl-alt-l = 'focus right --boundaries-action wrap-around-the-workspace'
ctrl-alt-left = 'focus left --boundaries-action wrap-around-the-workspace'
ctrl-alt-down = 'focus down --boundaries-action wrap-around-the-workspace'
ctrl-alt-up = 'focus up --boundaries-action wrap-around-the-workspace'
ctrl-alt-right = 'focus right --boundaries-action wrap-around-the-workspace'

ctrl-alt-n = 'focus dfs-next --boundaries-action wrap-around-the-workspace'

# See: https://nikitabobko.github.io/AeroSpace/commands#join-with
#ctrl-alt-y = 'join-with left'
#ctrl-alt-u = 'join-with down'
#ctrl-alt-i = 'join-with up'
#ctrl-alt-o = 'join-with right'

# See: https://nikitabobko.github.io/AeroSpace/commands#split
ctrl-alt-y = 'split horizontal'
ctrl-alt-u = 'split vertical'
ctrl-alt-i = 'split opposite'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'
ctrl-alt-shift-left = 'move left'
ctrl-alt-shift-down = 'move down'
ctrl-alt-shift-up = 'move up'
ctrl-alt-shift-right = 'move right'
# See: https://nikitabobko.github.io/AeroSpace/commands#flatten-workspace-tree
ctrl-alt-backspace = 'flatten-workspace-tree'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'
ctrl-alt-shift-minus = 'resize smart-opposite -50'
ctrl-alt-shift-equal = 'resize smart-opposite +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
ctrl-alt-a = 'workspace A'
ctrl-alt-s = 'workspace S'
ctrl-alt-d = 'workspace D'
ctrl-alt-f = 'workspace F'
ctrl-alt-q = 'workspace Q'
ctrl-alt-w = 'workspace W'
ctrl-alt-e = 'workspace E'
ctrl-alt-r = 'workspace R'
ctrl-alt-z = 'workspace Z'
ctrl-alt-x = 'workspace X'
ctrl-alt-c = 'workspace C'
ctrl-alt-v = 'workspace V'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
ctrl-alt-shift-a = 'move-node-to-workspace A --focus-follows-window'
ctrl-alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
ctrl-alt-shift-d = 'move-node-to-workspace D --focus-follows-window'
ctrl-alt-shift-f = 'move-node-to-workspace F --focus-follows-window'
ctrl-alt-shift-q = 'move-node-to-workspace Q --focus-follows-window'
ctrl-alt-shift-w = 'move-node-to-workspace W --focus-follows-window'
ctrl-alt-shift-e = 'move-node-to-workspace E --focus-follows-window'
ctrl-alt-shift-r = 'move-node-to-workspace R --focus-follows-window'
ctrl-alt-shift-z = 'move-node-to-workspace Z --focus-follows-window'
ctrl-alt-shift-x = 'move-node-to-workspace X --focus-follows-window'
ctrl-alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
ctrl-alt-shift-v = 'move-node-to-workspace V --focus-follows-window'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
ctrl-alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
ctrl-alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

ctrl-alt-shift-h = ['join-with left', 'mode main']
ctrl-alt-shift-j = ['join-with down', 'mode main']
ctrl-alt-shift-k = ['join-with up', 'mode main']
ctrl-alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

